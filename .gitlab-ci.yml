stages:
  - sync
  - deploy

variables:
  TRIGGER_TASK:
    value: ""
    options:
      - ""
      - "manual_sync"
      - "manual_site_themes_update"
      - "manual_deploy"
    description: "Select the task to run when starting a pipeline manually."

lektorium-deploy:
  stage: deploy
  image: alpine:latest
  variables:
    LC_ALL: C.UTF-8
    LANG: C.UTF-8
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - cat /etc/alpine-release
    - apk add --update python3 git docker-cli bash
    - apk add --update py3-pip || true
    - python3 -m venv ./venv
    - . ./venv/bin/activate
    - git tag && git status && git describe
    - pip install 'spherical-dev[dev]>=0.3.6.1,<0.4.0' wheel "Setuptools<81"
    - cp ${LEKTORIUM_DEPLOY_CONFIG} invoke.yaml
    - inv deploy
    - docker ps -a
    - deactivate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $TRIGGER_TASK == "manual_deploy"'
    - if: '$CI_PIPELINE_SOURCE != "web" && $CI_COMMIT_BRANCH == "master"'

manual_sync:
  stage: sync
  image: alpine:latest
  script:
    - apk add --no-cache git rsync openssh-client

    - repo_url=$(echo "${CI_REPOSITORY_URL}" | sed 's/.*@//')

    - git remote set-url origin https://oauth2:${CI_ACCESS_TOKEN}@$repo_url

    - git config --global user.name "GitLab CI"
    - git config --global user.email "ci@${CI_SERVER_HOST}"

    - git clone https://github.com/sphericalpm/lektorium.git /tmp/lektorium

    - rsync -av --delete --exclude='.git' /tmp/lektorium/ ./

    - git diff

    - git add .
    - git commit -am 'Sync with upstream repo'
    - git push origin HEAD:${CI_COMMIT_REF_NAME}

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $TRIGGER_TASK == "manual_sync"'

manual_site_themes_update:
  stage: sync
  image: alpine:latest
  variables:
    # Set this in the Run pipeline form to bypass config.yml. Site repository
    # URLs may be separated by spaces, commas, or newlines.
    CI_SITE_UPDATE_REPOS: ""
  script:
    - apk add --no-cache git openssh-client python3 py3-yaml

    - git config --global user.name "GitLab CI"
    - git config --global user.email "ci@${CI_SERVER_HOST}"
    - git config --global push.default simple

    # Use the same access token as manual_sync for HTTPS and SSH-style URLs.
    - git config --global url."https://oauth2:${CI_PROJECTS_ACCESS_TOKEN}@${CI_SERVER_HOST}/".insteadOf "git@${CI_SERVER_HOST}:"
    - git config --global --add url."https://oauth2:${CI_PROJECTS_ACCESS_TOKEN}@${CI_SERVER_HOST}/".insteadOf "ssh://git@${CI_SERVER_HOST}/"
    - git config --global --add url."https://oauth2:${CI_PROJECTS_ACCESS_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"

    - |
      if [ -n "${GITHUB_SSH_KEY:-}" ]; then
        mkdir -p ~/.ssh
        echo "$GITHUB_SSH_KEY" | base64 -d > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts
      fi

    - python3 ci/update_site_themes.py

  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $TRIGGER_TASK == "manual_site_themes_update"'
