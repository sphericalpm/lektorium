# Docs: https://prettier.io/docs/options

# Max line length before Prettier wraps.
printWidth: 127

# Number of spaces per indentation level.
tabWidth: 4

# Indent using tabs instead of spaces.
useTabs: false

# Print semicolons at the ends of statements.
semi: true

# Use single quotes instead of double quotes in JS/TS (where possible).
singleQuote: true

# Use single quotes in JSX (where possible).
jsxSingleQuote: true

# Print trailing commas wherever possible.
# Allowed: "all" | "es5" | "none"
trailingComma: all

# Print spaces between brackets in object literals.
# { foo: bar } vs {foo: bar}
bracketSpacing: true

# Put the > of a multi-line HTML/JSX element at the end of the last line
# instead of being alone on the next line.
bracketSameLine: false

# Include parentheses around a sole arrow function parameter.
# Allowed: "always" | "avoid"
arrowParens: avoid

# How to quote object properties.
# Allowed: "as-needed" | "consistent" | "preserve"
quoteProps: as-needed

# Whether to change single-quoted strings to double quotes in markdown.
# Allowed: "always" | "prefer-single" | "preserve"
# (Mostly relevant when formatting embedded JS/TS in markdown.)
proseWrap: preserve

###############################################################################
# HTML / VUE / MARKDOWN / YAML
###############################################################################

# How to wrap prose in Markdown.
# Allowed: "always" | "never" | "preserve"
# (Note: proseWrap is listed above; leaving here as reminder for docs readers.)

# Indent script and style tags in Vue files.
vueIndentScriptAndStyle: false

# How to handle whitespace sensitivity in HTML.
# Allowed: "css" | "strict" | "ignore"
htmlWhitespaceSensitivity: ignore

# In Markdown, wrap code fences and keep formatting stable.
# Whether to format code blocks in Markdown.
embeddedLanguageFormatting: auto # Allowed: "auto" | "off"

###############################################################################
# LINE ENDINGS
###############################################################################

# End of line handling.
# Allowed: "lf" | "crlf" | "cr" | "auto"
endOfLine: lf

###############################################################################
# EXPERIMENTAL / ADVANCED
###############################################################################

# Control object/array property/element placement when it can fit on one line.
# Allowed: preserve | collapse
# NOTE: Availability/behavior can depend on Prettier version.
objectWrap: preserve

# Prefer single attribute per line in HTML/JSX when line breaks occur.
# NOTE: Availability can depend on Prettier version.
singleAttributePerLine: true

###############################################################################
# OVERRIDES (PER-FILE / PER-GLOB SETTINGS)
###############################################################################
# Overrides let you apply options only to certain file types.
# This is the correct place for 'parser' if you ever need it.
# (Docs warn against setting parser at top-level.) :contentReference[oaicite:6]{index=6}
overrides:
  - files: '*.md'
    options:
      # For markdown, many teams prefer wrapping prose.
      proseWrap: always

  - files: ['*.yml', '*.yaml']
    options:
      # YAML formatting typically prefers 2 spaces.
      tabWidth: 2

  - files: '*.json'
    options:
      # JSON must use double quotes; Prettier will handle that.
      printWidth: 80

###############################################################################
# PLUGINS (EXAMPLE PATTERN)
###############################################################################
# Core Prettier supports plugins; plugin-specific options vary.
# Example for prettier-plugin-organize-imports or prettier-plugin-tailwindcss:
plugins:
  - prettier-plugin-jinja-template
#
# And plugin options (example, depends on plugin):
# tailwindConfig: "./tailwind.config.js"
